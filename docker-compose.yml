services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: grid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster:
    build: .
    container_name: grid_dagster
    restart: unless-stopped
    command: dagster-webserver -h 0.0.0.0 -p 3000 -m dags.grid_intelligence_dag
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DAGSTER_HOME: /app/dagster_home
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./dags:/app/dags
      - ./dbt:/app/dbt
      - ./scripts:/app/scripts
      - ./config:/app/config
      - ./models:/app/models
      - ./docs:/app/docs
      - ./dagster_home:/app/dagster_home

  streamlit:
    build: .
    container_name: grid_streamlit
    restart: unless-stopped
    command: streamlit run app/Home.py --server.port=8501 --server.address=0.0.0.0
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./app:/app/app
      - ./docs:/app/docs
      - ./config:/app/config

volumes:
  postgres_data: