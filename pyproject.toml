[project]
name = "nigeria-grid-intelligence"
version = "0.1.0"
description = "End-to-end data platform for Nigerian grid and mini-grid intelligence"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "dbt-core~=1.11.0",
    "dbt-postgres~=1.11.0",
    "pandas",
    "numpy",
    "xgboost>=3.0.1",
    "scikit-learn",
    "pulp[cbc]>=4.0",
    "streamlit",
    "plotly>=5.0",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy",
    "datasets",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",	
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["dbt/", "notebooks/"]

# Modules using dynamic YAML-loaded dicts and numpy-heavy scientific code
# where strict static typing adds limited value relative to its cost.
[[tool.mypy.overrides]]
module = [
    "grid_intelligence.ingestion.synthetic_fallback",
    "grid_intelligence.optimization.run_scenarios",
    "grid_intelligence.optimization.run_sensitivity",
    "grid_intelligence.optimization.run_multiyear",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_db: test requires a live Postgres database (skipped in CI)",
]